<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title> CONTENT DETAILS | JeevaMart </title>
    <!-- favicon -->
    <link rel="icon" href="https://yt3.ggpht.com/a/AGF-l78km1YyNXmF0r3-0CycCA0HLA_i6zYn_8NZEg=s900-c-k-c0xffffffff-no-rj-mo" type="image/gif" sizes="16x16">
    <link rel="stylesheet" href="css/contentDetails.css"> <!-- Fixed filename -->
    <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4a3b1f73a2.js"></script>
</head>

<body>
    <!-- HEADER -->
    <div id="header"></div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            load("header.html", "header"); // Load header
            load("footer.html", "footer"); // Load footer
        });

        function load(url, elementId) {
            const req = new XMLHttpRequest();
            req.open("GET", url, true);
            req.onload = function() {
                if (req.status >= 200 && req.status < 400) {
                    document.getElementById(elementId).innerHTML = req.responseText;
                } else {
                    console.error("Error loading the file: " + req.status);
                }
            };
            req.onerror = function() {
                console.error("Request failed");
            };
            req.send();
        }
    </script>

    <div id="containerProduct">
        <!-- JS rendered code -->
    </div>

    <div id="footer"></div>
    <script src="contentDetails.js"></script>
</body>
</html>
